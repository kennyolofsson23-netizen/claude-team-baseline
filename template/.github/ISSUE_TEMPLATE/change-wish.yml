name: Change Wish (ARB)
description: Propose a change to the stack, process, or baseline. Goes to ARB.
title: "[Change Wish] <short title>"
labels: ["change-wish", "needs-arb-review"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a change. The ARB reviews at its regular cadence (≤ 2 weeks).
        See `process/governance/change-wishes/README.md` for the full flow.

  - type: textarea
    id: what
    attributes:
      label: What change
      description: One or two sentences — the actual change being proposed.
      placeholder: "Add Redis to the approved stack as a cache for the customer-search endpoint."
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem this solves. What happens today without this change? Who feels the pain?
      placeholder: "Customer-search latency regressed to 2-3s per query — affecting onboarding flow."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: At least two. Why were they rejected?
      placeholder: |
        1. In-memory cache single-replica — rejected because: cache goes cold on every deploy
        2. Cache in App Service memory — rejected because: doesn't survive autoscale
    validations:
      required: true

  - type: dropdown
    id: urgency
    attributes:
      label: Urgency
      options:
        - "none — nice to have"
        - "blocks current work"
        - "critical — system at risk"
      default: 0
    validations:
      required: true

  - type: dropdown
    id: affects
    attributes:
      label: Affects
      options:
        - "claude-team-baseline (team-wide)"
        - "specific product (single repo)"
        - "all live products"
        - "process (governance / maintenance / docs)"
    validations:
      required: true

  - type: textarea
    id: cost
    attributes:
      label: Cost / impact
      description: One-off vs ongoing cost. Maintenance burden. Risks introduced. Rollback plan.
    validations:
      required: false

  - type: textarea
    id: questions
    attributes:
      label: Open questions
      description: Things the ARB should decide or point you at the right person for.
    validations:
      required: false
